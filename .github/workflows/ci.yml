name: Healthcare Email Triage CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: healthcare_email_triage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_email_triage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENAI_API_KEY: test-key
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_PASSWORD: testpassword

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          POSTGRES_PASSWORD=testpassword psql -h 127.0.0.1 -U postgres -d healthcare_email_triage -f init.sql

      - name: Run tests
        run: pytest -v
